[project]
name = "traceflow"
version = "0.1.0"
description = "TraceFlow AML money-laundering detection system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "TraceFlow Team"}
]
dependencies = [
    "polars>=0.20.0",
    "networkx>=3.2",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "jinja2>=3.1.0",
    "numba>=0.59.0",
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",
    "shap>=0.44.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"
